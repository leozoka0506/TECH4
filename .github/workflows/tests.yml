name: Testes
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: escuta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:test_only@127.0.0.1:5432/escuta_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-prod-lock.txt
      - run: python -c "import os,psycopg; c=psycopg.connect(os.environ['TEST_DATABASE_URL'],autocommit=True); c.execute('CREATE EXTENSION vector'); c.close()"
      - run: python -m pytest -q
      - run: node --check web/app.js
      - run: docker build -t escuta:test .
